<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#146b52" />
    <meta
      name="description"
      content="Deine Arbeitszeit. Lokal, privat und offline."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>TimeCount · Deine Zeit im Blick</title>
  </head>
  <body>
    <header class="header">
      <a class="brand" href="#today"
        ><span class="brand-icon" aria-hidden="true">◷</span>TimeCount</a
      ><span class="private">Nur auf diesem Gerät</span>
    </header>
    <main id="app" aria-busy="true"><p>Deine Zeiten werden geladen …</p></main>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <nav class="nav" aria-label="Hauptnavigation">
      <a href="#today" data-tab="today"
        ><span aria-hidden="true">◷</span>Heute</a
      ><a href="#calendar" data-tab="calendar"
        ><span aria-hidden="true">▦</span>Kalender</a
      ><a href="#reports" data-tab="reports"
        ><span aria-hidden="true">▥</span>Auswertung</a
      ><a href="#settings" data-tab="settings"
        ><span aria-hidden="true">⚙</span>Einstellungen</a
      >
    </nav>
    <dialog id="editor" aria-labelledby="dialog-title">
      <div id="dialog-body"></div>
      <button id="close-dialog" class="ghost close" type="button">
        Schließen
      </button>
    </dialog>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
